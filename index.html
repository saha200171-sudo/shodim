<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EF">
  <title>Сходим?</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Lora:wght@500&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app"><div class="boot">Сходим?</div></main>
  <script type="module" src="js/app.js"></script>
  <script>
    // Автообновление: при каждом открытии/разворачивании проверяем новую версию,
    // а когда она установилась — перезагружаемся в неё.
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      const hadController = !!navigator.serviceWorker.controller;
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!hadController || reloading) return;
        if (document.querySelector('.overlay')) return; // не сбиваем открытую шторку — обновимся при следующем открытии
        reloading = true; location.reload();
      });
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
      });
    }
  </script>
</body>
</html>
